# Construit le catalogue publié avec l'app (dossier catalog/) : extensions par ordre de sortie, logos,
# cartes avec images et noms traduits, et index visuels du scanner (Pokémon japonais, One Piece, Riftbound).
# Lancement : automatiquement chaque semaine et quand le script change,
# ou à la main depuis l'onglet Actions → « Catalogue de cartes » → Run workflow.
name: Catalogue de cartes

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Étapes (pokemon-ja, pokemon-intl, pokemon-cards, pokemon-details, pokemon-zh, onepiece, riftbound, lorcana, tcgplayer, cardtrader, visual, assets, prices), séparées par des virgules ; vide = toutes"
        default: ""
        required: false
      visual:
        description: "Index visuels à refaire (ex. pokemon-ja,pokemon-fr) ; vide = tous"
        default: ""
        required: false
      grab:
        description: "Images à télécharger dans catalog/_grab pour examen (URL séparées par des virgules)"
        default: ""
        required: false
  schedule:
    # Tout le catalogue chaque lundi ; les détails Pokémon, Riftbound et Lorcana (logos, nouvelles cartes) chaque jour ;
    # toutes les heures, les prix Cardmarket dès qu'un nouveau guide des prix est publié.
    - cron: "17 3 * * 1"
    - cron: "41 4 * * 0,2-6"
    - cron: "23 * * * *"
  push:
    branches: [main]
    paths:
      - tools/catalog/**
      - mobile/src/lib/scan/visualIndex.ts

permissions:
  contents: write

concurrency:
  group: build-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # Repartir du catalogue le plus récent : un passage lancé avant la fin du précédent (file d'attente)
      # écraserait sinon son travail en publiant une version plus ancienne.
      - name: Dernière version du dépôt
        run: |
          git fetch --depth=1 origin "$GITHUB_REF_NAME"
          git reset --hard FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/catalog/package-lock.json

      - name: Cache du modèle IA
        # Inutile au passage horaire des prix.
        if: github.event.schedule != '23 * * * *'
        uses: actions/cache@v4
        with:
          path: tools/catalog/node_modules/@xenova/transformers/.cache
          key: clip-vit-base-patch32-v1

      - name: Installer
        working-directory: tools/catalog
        run: npm ci --no-audit --no-fund

      - name: Construire le catalogue
        working-directory: tools/catalog
        env:
          STEPS: ${{ github.event.inputs.steps || (github.event.schedule == '41 4 * * 0,2-6' && 'pokemon-details,pokemon-zh,riftbound,lorcana,tcgplayer,cardtrader') || (github.event.schedule == '23 * * * *' && 'prices') || '' }}
          VISUAL_TARGETS: ${{ github.event.inputs.visual || '' }}
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
          GRAB_URLS: ${{ github.event.inputs.grab || '' }}
        run: npm test && npm run build

      - name: Enregistrer dans le dépôt
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Catalogue : mise à jour automatique"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 10
          done
          exit 1
