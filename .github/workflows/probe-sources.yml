# Outil de développement : explore des sources de données (statut, CORS, extrait de la réponse).
name: Explorer les sources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresses à tester, séparées par des espaces (vide = liste par défaut)"
        default: ""
        required: false
      deep:
        description: "Exploration détaillée (1) ou rapide (0)"
        default: "0"
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: if [ "${{ github.event.inputs.deep }}" = "1" ]; then tools/probe/deep.sh; else tools/probe/probe.sh; fi
        env:
          EXTRA_URLS: ${{ github.event.inputs.urls }}
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
